# This file configures the New Relic agent. New Relic monitors
# Java applications with deep visibility and low overhead. For more details and additional
# configuration options visit https://docs.newrelic.com/docs/agents/java-agent/configuration/java-agent-configuration-config-file.
#
# <%= generated_for_user %>
#
# Configuration precedence (highest to lowest):
#   1. Server-side configuration
#   2. Environment variables: NEW_RELIC_<PROPERTY_NAME> (dots/dashes become underscores)
#   3. System properties: -Dnewrelic.config.<property.path>
#   4. This newrelic.yml file
#
# Unless noted in the comments for a key, any value that is specified as a YAML array can use
# standard YAML array syntax or use a comma-delimited list: For example:
#   exclude: [one, two, three]
# or:
#   exclude: one, two, three
# are equivalent.

# This section is for settings common to all environments.
# Do not add anything above this next line.
common: &default_settings

  # ============================== LICENSE KEY ===============================
  # You must specify the license key associated with your New Relic
  # account. For example, if your license key is 12345 use this:
  # license_key: '12345'
  # The key binds your agent's data to your account in the New Relic UI.
  license_key: '<%= license_key %>'

  # Agent enabled
  # Use this setting to disable the agent instead of removing it from the startup command.
  # Default is true.
  agent_enabled: true

  # Differentiate JVMs for the same app on the same machine.
  # Use -Dnewrelic.config.appserver_port=8081 in JVM startup args.
  # Default: none
  appserver_port:

  # Set the name of your application as you'd like it to show up in the New Relic UI.
  # If enable_auto_app_naming is false, the agent reports all data to this application.
  # Otherwise, the agent reports only background tasks (transactions for non-web applications)
  # to this application. To report data to more than one application
  # (useful for rollup reporting), separate the application names with ";".
  # For example, to report data to "My Application" and "My Application 2" use this:
  # app_name: My Application;My Application 2
  # This setting is required. Up to 3 different application names can be specified.
  # The first application name must be unique.
  app_name: My Application

  # To enable high security, set this property to true. When in high
  # security mode, the agent will use SSL and obfuscated SQL. Additionally,
  # request parameters and message parameters will not be sent to New Relic.
  high_security: false

  # Set to true to enable support for auto app naming.
  # The name of each web app is detected automatically
  # and the agent reports data separately for each one.
  # This provides a finer-grained performance breakdown for
  # web apps in New Relic.
  # Default is false.
  enable_auto_app_naming: false

  # Set to true to enable component-based transaction naming.
  # Set to false to use the URI of a web request as the name of the transaction.
  # Default is true.
  enable_auto_transaction_naming: true

  # Enable @Trace annotation instrumentation.
  # Default: true
  enable_custom_tracing: true

  # The agent uses its own log file to keep its logging
  # separate from that of your application. Specify the log level here.
  # This setting is dynamic, so changes do not require restarting your application.
  # The levels in increasing order of verboseness are:
  #   off, severe, warning, info, fine, finer, finest
  # Default is info.
  log_level: info

  # Log all data sent to and from New Relic in plain text.
  # This setting is dynamic, so changes do not require restarting your application.
  # Default is false.
  audit_mode: false

  # The number of backup log files to save.
  # Default is 1.
  log_file_count: 1

  # The maximum number of kbytes to write to any one log file.
  # The log_file_count must be set greater than 1.
  # Default is 0 (no limit).
  log_limit_in_kbytes: 0

  # Override other log rolling configuration and roll the logs daily.
  # Default is false.
  log_daily: false

  # The name of the log file.
  # Default is newrelic_agent.log.
  log_file_name: newrelic_agent.log

  # The log file directory.
  # Default is the logs directory in the newrelic.jar parent directory.
  log_file_path:

  # Path to custom SSL certificate bundle.
  # Default: none
  ca_bundle_path:

  # When multiple datastore addresses detected, determines which to use.
  # Values: NONE, FIRST, LAST
  # Default: NONE
  datastore_multihost_preference: NONE

  # FedRAMP compliant endpoint.
  # Default: none (auto-derived from license key)
  host:

  # Collector API host override.
  # Default: rpm.newrelic.com
  api_host: rpm.newrelic.com

  # Collector API port override.
  # Default: 443
  api_port: 443

  # Workaround for memory leak with legacy async API instrumentation.
  # Default: false
  legacy_async_api_skip_suspend: false

  # Enables APM-in-Lambda mode.
  # Default: false
  apm_lambda_mode: false

  # Enables experimental runtime support.
  # Default: false
  experimental_runtime: false

  # gzip/deflate encoding used for payloads sent to the collector.
  # Default: gzip
  compressed_content_encoding: gzip

  # Enables the CPU sampler.
  # Default: true
  cpu_sampling_enabled: true

  # Toggles bootstrap classloader instrumentation.
  # Default: true
  enable_bootstrap_class_instrumentation: true

  # Toggles class retransformation support.
  # Default: none (auto-detected)
  enable_class_retransformation:

  # Jar names to skip during instrumentation scanning.
  # Default: empty list
  ignore_jars: []

  # Comma-separated list of enabled JDBC support modes.
  # Default: generic
  jdbc_support: generic

  # Reported agent language.
  # Default: java
  language: java

  # Disables default instrumentation for a minimal-footprint agent.
  # Default: false
  lite_mode: false

  # Enables verbose metric debug logging.
  # Default: false
  metric_debug: false

  # Reports platform/OS info to New Relic.
  # Default: true
  platform_information_enabled: true

  # Collector port override.
  # Default: 443
  port: 443

  # Uses HTTP PUT instead of POST when sending data to the collector.
  # Default: false
  put_for_data_send: false

  # Disables inner-payload compression.
  # Default: false
  simple_compression: false

  # Log level used only during agent startup, before the configured log_level takes effect.
  # Default: none
  startup_log_level:

  # Logs agent startup timing breakdown.
  # Default: true
  startup_timing: true

  # Records thread CPU time in transaction traces.
  # Default: false
  thread_cpu_time_enabled: false

  # Root-level HTTP request timeout, in seconds, to the collector.
  # Default: 120
  timeout: 120

  # Legacy audit-mode flag; also enables audit_mode when true.
  # Default: false
  trace_data_calls: false

  # Maximum transaction trace size, in KB.
  # Default: 2000
  transaction_size_limit: 2000

  # Blocks startup until the first collector connect completes.
  # Default: true
  wait_for_rpm_connect: true

  # Milliseconds to wait for in-flight transactions to finish before shutdown.
  # Default: 0
  wait_for_transactions: 0

  # Process/host identification overrides.
  process_host:
    # Overrides the reported hostname.
    # Default: none (auto-detected)
    display_name:

    # Set to "6" to force IPv6 address preference when auto-detecting the hostname.
    # Default: none
    ipv_preference:

  # Cross Application Tracing (CAT) — deprecated, superseded by distributed_tracing.
  cross_application_tracer:
    # Set to false to disable Cross Application Tracing.
    # Default: false
    enabled: false

    # Legacy CAT application id.
    # Default: none
    application_id:

  # Datastore instrumentation reporting configuration.
  datastore_tracer:
    instance_reporting:
      # Reports datastore instance information (host/port) on datastore spans.
      # Default: true
      enabled: true

    database_name_reporting:
      # Reports the database name on datastore spans.
      # Default: true
      enabled: true

    database_connection_metadata:
      # Reports database connection metadata on datastore spans.
      # Default: true
      enabled: true

  # External HTTP call tracer configuration.
  external_tracer:
    # Excludes the request URI from external call segment names.
    # Default: false
    exclude_request_uri: false

  # JAR collector configuration; reports the JARs loaded by the JVM.
  jar_collector:
    # Enables the jar collector.
    # Default: true
    enabled: true

    # Skips jars located in temp directories.
    # Default: true
    skip_temp_jars: true

    # Throughput throttle, in jars per second.
    # Default: 10
    jars_per_second: 10

  # JMX metric collection configuration.
  jmx:
    # Master on/off switch for JMX metric collection.
    # Default: true
    enabled: true

    # JMX frameworks to disable.
    # Default: empty list
    disabled_jmx_frameworks: []

    # Iterates ObjectName keys when building JMX metric names.
    # Default: true
    enable_iterated_objectname_keys: true

    # Registers an MBean exposing agent linking metadata.
    # Default: false
    linkingMetadataMBean: false

  # Remote reinstrumentation (instrumentation editor) configuration.
  reinstrument:
    # Set to false to disable remote reinstrumentation.
    # Default: true
    enabled: true

    # Captures attributes during remote reinstrumentation.
    # Default: false
    attributes_enabled: false

  # AWS Lambda serverless mode configuration.
  serverless_mode:
    # Set to true to enable serverless mode. Auto-detected in Lambda environments if not set explicitly.
    # Default: false
    enabled: false

    # Local file telemetry is written to in serverless mode.
    # Default: /tmp/newrelic-telemetry
    file_path: /tmp/newrelic-telemetry

    # Lambda function ARN.
    # Default: none
    arn:

    # Lambda function version.
    # Default: none
    function_version:

  # Strips exception messages from collected errors, for high security environments.
  strip_exception_messages:
    # Set to true to strip exception messages. Defaults to the high_security setting when unset.
    # Default: false
    enabled: false

    # Exception classes allowed to keep their messages even when stripping is enabled.
    # Default: empty list
    allowed_classes: []

  # The values below are provided by the New Relic collector on connect (RUM/browser loader
  # payload, AI Monitoring account-wide gate, Security Agent identifiers, OTLP resource
  # attributes, and advisory messages). They are not user-configurable locally; listed here
  # only so the agent recognizes them as known keys.
  #
  # NOTE: the collector-pushed "instrumentation" (live remote reinstrumentation payload,
  # RemoteInstrumentationServiceImpl.INSTRUMENTATION_CONFIG) is NOT listed here — it collides
  # with the existing local "instrumentation.hibernate.stats_sampler.enabled" key below
  # (same top-level YAML key, incompatible shapes: List<Map> vs nested object). Needs a
  # decision on how to disambiguate before it can be added.
  account_id:
  agent_run_id:
  application_id:
  beacon:
  browser_key:

  # Account-wide server flag gating AI Monitoring; overrides ai_monitoring.enabled. Surfaced
  # read-only in the Fleet Control UI.
  collect_ai:

  error_beacon:
  js_agent_file:
  js_agent_loader:

  messages: []
  otlp_resource_attributes: {}
  request_headers_map: {}

  # Kotlin Coroutines instrumentation configuration. Allows excluding specific coroutine
  # continuations, scopes, dispatched calls, and suspend functions from tracing (by exact
  # name or regex), and controls tracing of delayed coroutines.
  coroutines:
    continuations:
      # Comma-separated list of continuation class/method names to exclude from tracing.
      # Default: none
      ignore: ''

      # Regex pattern for continuation names to exclude from tracing.
      # Default: none
      ignoreRegex: ''

    scopes:
      # Comma-separated list of coroutine scope names to exclude from tracing.
      # Default: none
      ignore: ''

      # Regex pattern for coroutine scope names to exclude from tracing.
      # Default: none
      ignoreRegex: ''

    dispatched:
      # Comma-separated list of dispatched coroutine names to exclude from tracing.
      # Default: none
      ignore: ''

      # Regex pattern for dispatched coroutine names to exclude from tracing.
      # Default: none
      ignoreRegex: ''

    suspends:
      # Comma-separated list of suspend function names to exclude from tracing.
      # Default: none
      ignore: ''

      # Regex pattern for suspend function names to exclude from tracing.
      # Default: none
      ignoreRegex: ''

    # Controls tracing of delayed coroutines.
    delayed:
      # Default: true
      enabled: true

  # Report Reactor Netty errors.
  # Default: false
  reactor-netty:
    errors:
      enabled: false

  # gRPC instrumentation configuration.
  grpc:
    # Enable distributed tracing for gRPC calls.
    # Default: true
    distributed_tracing:
      enabled: true

    # Report gRPC errors.
    # Default: true
    errors:
      enabled: true

  # Hibernate instrumentation configuration.
  instrumentation:
    hibernate:
      # Enable Hibernate statistics sampler.
      # Default: false
      stats_sampler:
        enabled: false

  # Kafka instrumentation configuration.
  kafka:
    # Kafka configuration emission settings.
    config:
      # List of environment attributes to include with Kafka config events.
      # Default: empty list
      environment_attributes: []

    # Kafka metrics configuration.
    metrics:
      # Enable debug logging for Kafka metrics.
      # Default: false
      debug:
        enabled: false

      # Report Kafka metrics as custom events instead of dimensional metrics.
      # Default: false
      as_events:
        enabled: false

      # Reporting interval in seconds for Kafka metrics.
      # Default: 30
      interval: 30

      # Disable collection of Kafka node-level metrics.
      # Default: false
      node:
        metrics:
          disabled: false

      # Disable collection of Kafka topic-level metrics.
      # Default: false
      topic:
        metrics:
          disabled: false

  # Netty instrumentation configuration.
  netty:
    http2:
      frame_read_listener:
        # Start a new transaction for HTTP/2 frame read events.
        # Default: false
        start_transaction: false

  # Report Scala Futures as transaction segments.
  # Default: false
  scala_futures_as_segments:
    enabled: false

  # Scala CallbackRunnable instrumentation.
  scala:
    callbackrunnable:
      # Enable CallbackRunnable instrumentation for Scala futures.
      # Default: false
      enabled: false

  # Send data on JVM exit.
  # Default: false
  send_data_on_exit: false

  # Seconds app must run before send_data_on_exit applies.
  # Default: 60
  send_data_on_exit_threshold: 60

  # Wait for New Relic connection on app startup.
  # Default: false
  sync_startup: false

  # Report JVM settings to New Relic.
  # Default: true
  send_environment_info: true

  # Aggregate metrics for segments with <2% of transaction time.
  # Default: true
  trim_stats: true

  # Seconds before async token auto-expires.
  # Default: 180
  token_timeout: 180

  # Seconds before segment auto-ends.
  # Default: 600
  segment_timeout: 600

  # AI Monitoring captures insights on the performance, quality, and cost of interactions with LLM models made with instrumented SDKs.
  ai_monitoring:

    # Provides control over all AI Monitoring functionality. Set as true to enable all AI Monitoring features.
    # Default is false.
    enabled: false

    # Provides control over whether attributes for the input and output content should be added to LLM events.
    record_content:

      # Set as false to disable attributes for the input and output content.
      # Default is true.
      enabled: true

  # Provides the ability to forward application logs to New Relic, generate log usage metrics,
  # and decorate local application log files with agent metadata for use with third party log forwarders.
  # The application_logging.forwarding and application_logging.local_decorating should not be used together.
  application_logging:

    # Provides control over all the application logging features for forwarding, local log
    # decorating, and metrics features. Set as false to disable all application logging features.
    # Default is true.
    enabled: true

    # The agent will automatically forward application logs to New Relic in
    # a format that includes agent metadata for linking them to traces and errors.
    forwarding:

      # When true, application logs will be forwarded to New Relic. The default is true.
      enabled: true

      # When true and "enable_auto_app_naming" is also true, log events will be sent
      # to their corresponding named entity rather than the roll up entity.
      # Default is false.
      auto_app_naming_association: false

      # Application log events are collected up to the configured amount. Afterwards,
      # events are sampled to maintain an even distribution across the harvest cycle.
      # Default is 10000. Setting to 0 will disable.
      max_samples_stored: 10000

      # Provides the ability to add custom tags(labels) to agent forwarded logs. Labels are
      # pulled from the top-level 'labels' section (located near the bottom of this config file).
      # Default is false.
      labels:

        # When true, custom tags (labels) will be added to agent forwarded logs.
        enabled: false

        # A comma separated list of label keys that should NOT be added to application logs.
        exclude: []

      # Whether the log events should include context from loggers with support for that.
      context_data:

        # When true, application logs will contain context data.
        enabled: false

        # A comma separated list of attribute keys whose values should be sent to New Relic.
        include: []

        # A comma separated list of attribute keys whose values should not be sent to New Relic.
        exclude: []

      # A comma separated list of strings representing log levels that should not be forwarded. Log level names are case-insensitive but otherwise must be an exact match.
      # Example values: "info, debug"
      log_level_denylist:

    # The agent will generate metrics to indicate the number of
    # application log events occurring at each distinct log level.
    metrics:

      # When true, application log metrics will be reported. The default is true.
      enabled: true

    # The agent will add linking metadata to each log line in your application log files.
    # This feature should only be used if you want to use a third party log forwarder, instead
    # of the agent's built-in forwarding feature, to send your application log events to New Relic.
    local_decorating:
      # When true, the agent will decorate your application log files with linking metadata.
      # The default is false.
      enabled: false

  # Adds integration with CodeStream, introducing Code-Level Metrics! Golden Signals visible in your
  # IDE through New Relic CodeStream.
  code_level_metrics:

    # When true the agent will capture namespace and function information
    # on spans to enable code level metrics in CodeStream.
    enabled: true

  # Provides integration with New Relic Agent Control, a sidecar responsible for agent
  # supervision and health reporting in containerized/Kubernetes environments.
  agent_control:

    # When true, the agent periodically reports its health status to Agent Control.
    # Default is false.
    enabled: false

    # Health check reporting settings for the Agent Control integration.
    health:

      # Location the agent writes health status files to, in URI format. The client type
      # used to report health (file, etc.) is derived from the URI scheme.
      # Default: file:///newrelic/apm/health
      delivery_location: 'file:///newrelic/apm/health'

      # How often, in seconds, the agent reports its health status to Agent Control.
      # Default is 5.
      frequency: 5

  # Proxy settings for connecting to the New Relic server:
  # If a proxy is used, the host setting is required. Other settings
  # are optional. Default port is 8080. The username and password
  # settings will be used to authenticate to Basic Auth challenges
  # from a proxy server. Proxy scheme will allow the agent to
  # connect through proxies using the HTTPS scheme.
  proxy_host:
  proxy_port: 8080
  proxy_user:
  proxy_password:
  proxy_scheme: http

  # Limits the maximum lifetime of a persistent connection to the New Relic collector.
  # Set this below the shortest proxy or network connection timeout to avoid reusing stale connections.
  # A value of 0 allows connections to remain open indefinitely. Default is 0 seconds.
  collector_connection_ttl: 0

  # Cloud environment settings for container metadata collection:
  # When running in containerized environments (like AWS Fargate) with a proxy,
  # metadata endpoints may need to bypass the proxy to be accessible.
  cloud:
    aws:
      # AWS account ID for cloud.resource_id attribute.
      account_id: ''
    #
    # Bypass proxy for cloud metadata endpoints.
    # Default: false
    metadata_bypass_proxy: false

  # Cloud platform utilization settings.
  utilization:
    # Poll AWS metadata API.
    # Default: true
    detect_aws: true

    # Poll Azure metadata API.
    # Default: true
    detect_azure: true

    # Poll GCP metadata API.
    # Default: true
    detect_gcp: true

    # Report KUBERNETES_SERVICE_HOST env var.
    # Default: true
    detect_kubernetes: true

    # Read PCF environment variables.
    # Default: true
    detect_pcf: true

    # Read Docker info from file system.
    # Default: true
    detect_docker: true

    # Overrides the detected total RAM, in MiB.
    # Default: none (auto-detected)
    total_ram_mib:

    # Overrides the detected logical processor count.
    # Default: none (auto-detected)
    logical_processors:

    # Overrides the billing hostname reported in utilization data.
    # Default: none (auto-detected)
    billing_hostname:

  # Limits the number of lines to capture for each stack trace.
  # Default is 30
  max_stack_trace_lines: 30

  # Provides the ability to configure the attributes sent to New Relic. These
  # attributes can be found in transaction traces, traced errors,
  # transaction events, and page views.
  attributes:

    # When true, attributes will be sent to New Relic. The default is true.
    enabled: true

    # A comma separated list of attribute keys whose values should
    # be sent to New Relic.
    include: []

    # A comma separated list of attribute keys whose values should
    # not be sent to New Relic.
    exclude: []

    # Defines which sets of http attributes the agent will send: standard, legacy or both (default).
    # Having the agent send both sets will increase ingestion.
    # Having the agent send only legacy may impact current or future functionality.
    http_attribute_mode: both

  # Custom events configuration.
  custom_insights_events:
    # Enable custom event collection.
    # Default: true
    enabled: true

    # Max attribute value length (max 4095).
    # Default: 255
    max_attribute_value: 255

    # Max custom events per minute.
    # Default: 30000
    max_samples_stored: 30000

  # Transaction tracer captures deep information about slow
  # transactions and sends this to the New Relic service once a
  # minute. Included in the transaction is the exact call sequence of
  # the transactions including any SQL statements issued.
  transaction_tracer:

    # Transaction tracer is enabled by default. Set this to false to turn it off.
    # This feature is not available to Lite accounts and is automatically disabled.
    # Default is true.
    enabled: true

    # Threshold in seconds for when to collect a transaction
    # trace. When the response time of a controller action exceeds
    # this threshold, a transaction trace will be recorded and sent to
    # New Relic. Valid values are any float value, or (default) "apdex_f",
    # which will use the threshold for the "Frustrated" Apdex level
    # (greater than four times the apdex_t value).
    # Default is apdex_f.
    transaction_threshold: apdex_f

    # Controls the addition of comments to the beginning of executed SQL
    # statements to be used by the New Relic Query Performance Monitoring
    # product for entity linking. Default is false.
    #
    # A resulting comment would resemble this:
    # /*nr_service_guid=MTE3NDc2MDB8QVBNfAAAAAxJQEEEEE9OfDI4MTc5NDEIEA*/
    sql_metadata_comments:
      enabled: false

    # For large SQL statements, executing the regular expressions that attempt to parse exec and
    # call statements can take a significant amount of time. Setting this to true will disable the
    # execution of these complex regular expressions.
    # Default is false.
    exec_call_sql_regex_disabled: false

    # When transaction tracer is on, SQL statements can optionally be
    # recorded. The recorder has three modes, "off" which sends no
    # SQL, "raw" which sends the SQL statement in its original form,
    # and "obfuscated", which strips out numeric and string literals.
    # Default is obfuscated.
    record_sql: obfuscated

    # Set this to true to log SQL statements instead of recording them.
    # SQL is logged using the record_sql mode.
    # Default is false.
    log_sql: false

    # Threshold in seconds for when to collect stack trace for a SQL
    # call. In other words, when SQL statements exceed this threshold,
    # then capture and send to New Relic the current stack trace. This is
    # helpful for pinpointing where long SQL calls originate from.
    # Default is 0.5 seconds.
    stack_trace_threshold: 0.5

    # Determines whether the agent will capture query plans for slow
    # SQL queries. Only supported for MySQL and PostgreSQL.
    # Default is true.
    explain_enabled: true

    # Threshold for query execution time below which query plans will
    # not be captured. Relevant only when `explain_enabled` is true.
    # Default is 0.5 seconds.
    explain_threshold: 0.5

    # Use this setting to control the variety of transaction traces.
    # The higher the setting, the greater the variety.
    # Set this to 0 to always report the slowest transaction trace.
    # Default is 20.
    top_n: 20

    # Includes GC time in transaction traces. Disabled by default because it's inaccurate
    # in async scenarios.
    # Default: false
    gc_time_enabled: false

    # Max length of inserted SQL text.
    # Default: 2000
    insert_sql_max_length: 2000

    # Max stack trace segments captured per trace.
    # Default: 20
    max_stack_trace: 20

    # Max segments captured per trace.
    # Default: 3000
    segment_limit: 3000

    # Max explain plans captured per harvest.
    # Default: 20
    max_explain_plans: 20

    # Max async tokens captured per trace.
    # Default: 3000
    token_limit: 3000

    # Modules allowed to report slow queries while high security is enabled.
    # Default: empty list
    collect_slow_queries_from: []

    # This setting can be used to turn on or off all attributes for transaction traces.
    attributes:
      enabled: true

      # If attributes are enabled for transaction traces, all attribute keys found in
      # this list will be sent to New Relic in transaction traces.
      include: []

      # All attribute keys found in this list will not be sent to New Relic in transaction traces.
      exclude: []

  # Error collector captures information about uncaught exceptions and
  # sends them to New Relic for viewing.
  error_collector:

    # This property enables the collection of errors. If the property is not
    # set or the property is set to false, then errors will not be collected.
    # Default is true.
    enabled: true

    # Legacy exception handler signatures (method signature strings) to instrument as
    # error-producing exception handlers. Rarely used directly in YAML.
    # Default: empty list
    exception_handlers: []

    # Use this property to exclude specific exceptions from being reported as errors
    # by providing a comma separated list of full class names.
    # The default is to exclude akka.actor.ActorKilledException. If you want to override
    # this, you must provide any new value as an empty list is ignored.
    ignore_classes:
      - "akka.actor.ActorKilledException"

    # Legacy predecessor of ignore_classes; deprecated but still honored if ignore_classes is unset.
    # Default: same as ignore_classes
    ignore_errors:
      - "akka.actor.ActorKilledException"

    # Local/server gate for error events, distinct from the top-level "enabled" flag.
    # Default: true
    capture_events: true

    # Error event reservoir size.
    # Default: 100
    max_event_samples_stored: 100

    # Controls whether ignored errors take priority over expected errors when both match.
    # Default: true
    ignoreErrorPriority: true

    # Use this property to exclude specific http status codes from being reported as errors
    # by providing a comma separated list of status codes.
    # The default is to exclude 404s. If you want to override
    # this, you must provide any new value because an empty list is ignored.
    ignore_status_codes: 404

    # Exception messages to ignore by class.
    # Example:
    #   java.lang.IllegalArgumentException:
    #     - 'Invalid input*'
    ignore_messages: {}

    # Expected exception classes (counted but not errors). Array type only.
    expected_classes: []

    # Expected HTTP status codes.
    expected_status_codes: []

    # Expected messages by class.
    expected_messages: {}

  # Transaction events are used for histograms and percentiles. Non-aggregated data is collected
  # for each web transaction and sent to the server on harvest.
  transaction_events:

    # Set to false to disable transaction events.
    # Default is true.
    enabled: true

    # Events are collected up to the configured amount. Afterwards, events are sampled to
    # maintain an even distribution across the harvest cycle.
    # Default is 2000. Setting to 0 will disable.
    max_samples_stored: 2000

    # Custom request headers to capture on transaction events. Each entry has a required
    # header_name and an optional header_alias used as the attribute name.
    # Default: empty list
    custom_request_headers: []

    # This setting can be used to turn on or off all attributes for transaction events.
    attributes:
      enabled: true

      # If attributes are enabled for transaction events, all attribute keys found in
      # this list will be sent to New Relic in transaction treventsaces.
      include: [ ]

      # All attribute keys found in this list will not be sent to New Relic in transaction events.
      exclude: [ ]

  # Distributed tracing lets you see the path that a request takes through your distributed system.
  # This replaces the legacy Cross Application Tracing feature.
  distributed_tracing:

    # Set to false to disable distributed tracing.
    # Default is true.
    enabled: true

    # Agent versions 5.10.0+ utilize both the newrelic header and W3C Trace Context headers for distributed tracing.
    # The newrelic distributed tracing header allows interoperability with older agents that don't support W3C Trace Context headers.
    # Agent versions that support W3C Trace Context headers will prioritize them over newrelic headers for distributed tracing.
    # If you do not want to utilize the newrelic header, setting this to true will result in the agent excluding the newrelic header
    # and only using W3C Trace Context headers for distributed tracing.
    # Default is false.
    exclude_newrelic_header: false

    # Sends the NR-not-sampled header for message queues.
    # Default: false
    send_message_queue_not_sampled_header: false

    # Trusted account key used to validate inbound distributed tracing payloads. Server-merged
    # on connect; not typically set locally.
    # Default: none
    trusted_account_key:

    # Account id embedded in distributed tracing trust checks. Server-merged on connect.
    # Default: none
    account_id:

    # Primary application id embedded in outbound distributed tracing payloads. Server-merged
    # on connect.
    # Default: none
    primary_application_id:

    # Agent version 8.20.0+ utilize these settings for controlling how to sample when we have a remote parent
    # involved. That is, if there is a valid traceparent with a value in the sampled flag on the inbound headers.
    # If the inbound traceparent is marked as sampled then the remote_parent_sampled setting will be used.
    # If the inbound traceparent is marked as NOT sampled then the remote_parent_not_sampled setting will be used.
    # Otherwise New Relic's standard sampling will be used.
    # Note: Reservoir limits are still in effect on top of these settings, so spans may be dropped even if they
    # are marked for sampling, if the reservoir reaches its limit (max_samples_stored).
    #
    # Each of root/remote_parent_sampled/remote_parent_not_sampled accepts either a plain string
    # naming the sampler type, or a single-key object nesting type-specific options:
    #   root: adaptive
    # is equivalent to:
    #   root:
    #     adaptive:
    # Possible sampler types:
    #   default: New Relic's standard sampling rules will be used.
    #   adaptive: Target a specific number of sampled traces per harvest (sampling_target sub-option).
    #   always_on: Always sample spans in this case.
    #   always_off: Always skip sampling in this case.
    #   trace_id_ratio_based: Sample a fixed ratio of traces (required ratio sub-option, 0.0-1.0).
    sampler:
      # Shared adaptive sampling target used by any sampler configured as "adaptive" without its
      # own sampling_target sub-option.
      # Default: 120
      adaptive_sampling_target: 120

      root: default
      remote_parent_sampled: default
      remote_parent_not_sampled: default

  # New Relic's distributed tracing UI uses Span events to display traces across different services.
  # Span events capture attributes that describe execution context and provide linking metadata.
  # Span events require distributed tracing to be enabled.
  span_events:

    # Set to false to disable Span events.
    # Default is true.
    enabled: true

    # Determines the number of Span events that can be captured during an agent harvest cycle.
    # Increasing the number of Span events can lead to additional agent overhead. A maximum value may be imposed server side by New Relic.
    # Default is 2000
    max_samples_stored: 2000

    # Reservoir target size used by the adaptive sampler.
    # Default: 10
    target_samples_stored: 10

    # Provides the ability to filter the attributes attached to Span events.
    # Custom attributes can be added to Span events using the NewRelic.getAgent().getTracedMethod().addCustomAttribute(...) API.
    attributes:

      # When true, attributes will be sent to New Relic. The default is true.
      enabled: true

      # A comma separated list of attribute keys whose values should be sent to New Relic.
      include: []

      # A comma separated list of attribute keys whose values should not be sent to New Relic.
      exclude: []

  # Thread profiler measures wall clock time, CPU time, and method call counts
  # in your application's threads as they run.
  # This feature is not available to Lite accounts and is automatically disabled.
  thread_profiler:

    # Set to false to disable the thread profiler.
    # Default is true.
    enabled: true

  # New Relic Real User Monitoring (RUM) gives you insight into the performance real users are
  # experiencing with your website. This is accomplished by measuring the time it takes for
  # your users' browsers to download and render your web pages by injecting a small amount
  # of JavaScript code into the header and footer of each page.
  browser_monitoring:

    # By default the agent automatically inserts API calls in compiled JSPs to
    # inject the monitoring JavaScript into web pages. Not all rendering engines are supported.
    # See https://docs.newrelic.com/docs/agents/java-agent/instrumentation/new-relic-browser-java-agent#manual_instrumentation
    # for instructions to add these manually to your pages.
    # Set this attribute to false to turn off this behavior.
    auto_instrument: true

    # For pages that emit the <head> tag via a JSP tag library, enabling this setting
    # will monitor JspWriter print/println calls for output of the <head> element and
    # inject the RUM script automatically.
    tag_lib_instrument: false

    # If tag_lib_instrument is true, this is the regex pattern that will be used to detect HTML start head elements. Modify
    # the regex if you have more complex start head elements (attributes for example). The defined pattern is case-insensitive.
    tag_lib_head_pattern: '<head>'

    # Pages to skip auto instrumentation (comma-separated).
    disabled_auto_pages: []

    # RUM loader type: rum, full, or none.
    # Default: rum
    loader: rum

    # Sends non-minified browser JS for debugging.
    # Default: false
    debug: false

    # Forces HTTPS RUM instrumentation on HTTP pages.
    # Default: true
    ssl_for_http: true

    # Allows the RUM footer to be injected on every request instead of once per transaction.
    # Default: false
    allow_multiple_footers: false

    # Version tag of the browser JS loader. Set by New Relic on connect; not user-configurable.
    loader_version:

    attributes:
      # Enable attributes for browser monitoring.
      # Default: false
      enabled: false

      # Attribute keys to include.
      include: []

      # Attribute keys to exclude.
      exclude: []

  # By default, the agent sends JVM input arguments to New Relic, where they are visible as Environment data.
  # Set to false to disable the sending of JVM props.
  send_jvm_props: true

  # Before sending JVM props to New Relic, the agent will obfuscate all data in a prop after an = sign.
  # For example, the property -Dmy.prop=my-value will be sent to New Relic as -Dmy.prop=obfuscated.
  # By default, the standard and extended JVM props (those beginning with -X*) are sent unobfuscated.
  # Available since agent 8.16.0.
  obfuscate_jvm_props:
    # To disable this feature, and send all JVM props unobfuscated, set enabled to false.
    # The default is true.
    enabled: true

    # A comma separated list of JVM property names whose values should be sent to New Relic unobfuscated.
    allow: []

    # A comma separated list of JVM property names whose values should be sent to New Relic obfuscated.
    block: []

  # Circuit breaker protection settings.
  circuitbreaker:
    # Enable circuit breaker protection.
    # Default: true
    enabled: true

    # Free heap memory percentage threshold.
    # Default: 20
    memory_threshold: 20

    # GC CPU percentage threshold.
    # Default: 10
    gc_cpu_threshold: 10

  # JDBC Statements are cached in a weak key map by default. Set enabled:false to use a vanilla ConcurrentHashMap instead.
  # Users who set enabled:false MUST call Statement.close() on every JDBC Statement.
  jdbc_statement_weak_key_caching:
    enabled: true

  # Class transformer can be used to disable all agent instrumentation or specific instrumentation modules.
  # All instrumentation modules can be found here: https://github.com/newrelic/newrelic-java-agent/tree/main/instrumentation
  class_transformer:

    # Custom @Trace-equivalent annotation class names.
    # Default: empty list
    trace_annotation_class_name: []

    # Set to false to disable the class transformer (and therefore all instrumentation).
    # Default: true
    enabled: true

    # Enables all default (built-in) instrumentation modules. Only respected if instrumentation
    # is not disabled by lite_mode.
    # Default: true
    instrumentation_default:
      enabled: true

    # Enables builtin extension instrumentation modules (in addition to instrumentation_default).
    # Default: true
    builtin_extensions:
      enabled: true

    # Classes force-included for transformation.
    # Default: empty list
    includes: []

    # Classes excluded from transformation.
    # Default: empty list
    excludes: []

    # Classloaders excluded from delegation.
    # Default: empty list
    classloader_delegation_excludes: []

    # Classloaders included for delegation.
    # Default: empty list
    classloader_delegation_includes: []

    # Grants package access during weaving.
    # Default: false
    grant_package_access: false

    # Cache size for prevalidated classloaders.
    # Default: 10
    max_prevalidated_classloaders: 10

    # Prevalidates weave packages at startup.
    # Default: true
    prevalidate_weave_packages: true

    # Pre-filters weave method matches.
    # Default: true
    prematch_weave_methods: true

    # Enables default method tracing.
    # Default: true
    default_method_tracing_enabled: true

    # ASM COMPUTE_FRAMES toggle.
    # Default: true
    compute_frames: true

    # Delay, in seconds, before shutdown class transform teardown. A value <= 0 disables the delay.
    # Default: -1
    shutdown_delay: -1

    # Rate limit, in milliseconds, for auto async linking.
    # Default: 1000
    auto_async_link_rate_limit: 1000

    # Comma-separated list of JDBC statement types to trace.
    # Default: none
    jdbc_statements:

    # This instrumentation reports the name of the user principal returned from
    # HttpServletRequest.getUserPrincipal() when servlets and filters are invoked.
    com.newrelic.instrumentation.servlet-user:
      enabled: false

    com.newrelic.instrumentation.spring-aop-2:
      enabled: false

    # This instrumentation reports metrics for resultset operations.
    com.newrelic.instrumentation.jdbc-resultset:
      enabled: false

    # HttpURLConnection instrumentation verbosity setting.
    # When true, captures every response handler method as a segment.
    # When false, suppresses segments that don't make external calls.
    # Default is true.
    com.newrelic.instrumentation.httpurlconnection:
      verbose: true

    # Classes loaded by classloaders in this list will not be instrumented.
    # This is a useful optimization for runtimes which use classloaders to
    # load dynamic classes which the agent would not instrument.
    classloader_excludes: []

    # Enhanced Spring transaction naming.
    # This feature will name any transaction that originates from a Spring controller after
    # the defined route and HTTP method. For example: "/customer/v1/edit (POST)".
    # This includes controllers that implement or extend interfaces/classes with WebMVC related
    # annotations (@RestController, @Controller, @RequestMapping, etc). By default, this is configured
    # to false, which will name transactions for those types of controllers based on the controller
    # class name and method. For example; "CustomerController/edit". This is the naming logic carried
    # over from previous agent versions. "Standard" controllers, with all relevant annotations
    # present on the actual class, will still get named based on route and HTTP method.
    enhanced_spring_transaction_naming: false

    # Use controller class and method for Spring transaction naming.
    # When true, all Spring Controller transactions will be named using the controller class name
    # and method name (e.g., "/CustomerController/edit") instead of using request mappings
    # (e.g., "/api/v1/customer (POST)"). This setting takes precedence over enhanced_spring_transaction_naming.
    # This helps prevent transaction name cardinality issues with complex URI patterns.
    # Applies to Spring 4.3.x+ (spring-4.3.0 module) and Spring 6.x+ (spring-6.0.0 module).
    # Default is false.
    use_controller_class_and_method_for_spring_transaction_naming: false

    # The number of threads to use when parallelizing class matching and weave package
    # loading. Set this to 0 in order to set the value to the number of available
    # processors (via the Runtime.getRuntime().availableProcessors() call).
    weave_task_thread_count: 8

    # By default, built-in actuator endpoints and custom actuator endpoints (using the @Endpoint annotation
    # and it's subclasses) will all be named as "OperationHandler/handle" in New Relic. Setting this
    # to true will result in the transaction name reflecting the actual base actuator endpoint URI.
    # For example, invoking "/actuator/loggers" or "actuator/loggers/com.newrelic" will result in the
    # transaction name "actuator/loggers (GET)". This is to prevent MGI.
    # Default is false.
    name_actuator_endpoints: false

  # Extensions directory configuration.
  extensions:
    # Location of extensions directory.
    # Default: extensions subdirectory of newrelic.jar location
    dir:

    # Reload extension files when they're modified on disk.
    # Default: true
    reload_modified: true

  # Slow SQL tracing configuration.
  slow_sql:
    # Enable slow SQL tracing.
    # Default: true
    enabled: true

    # Uses a longer (higher-entropy) id for slow SQL traces.
    # Default: false
    use_longer_sql_id: false

  # Metric ingest URI. Determines where dimensional metric data is sent for
  # JFR profiling. If not explicitly configured, the metric_ingest_uri
  # will be automatically derived from the license_key (recommended).
  #
  # The default URI is for the US region.
  metric_ingest_uri: https://metric-api.newrelic.com/metric/v1

  # Event ingest URI. Determines where event data is sent for
  # JFR profiling. If not explicitly configured, the event_ingest_uri
  # will be automatically derived from the license_key (recommended).
  #
  # The default URI is for the US region.
  event_ingest_uri: https://insights-collector.newrelic.com/v1/accounts/events

  # Real-time profiling using Java Flight Recorder (JFR).
  # This feature reports dimensional metric and event data to the endpoints
  # configured by metric_ingest_uri and event_ingest_uri, respectively.
  # Requires a JVM that provides the JFR library.
  jfr:

    # Set to true to enable Real-time profiling with JFR.
    # Default is false.
    enabled: false

    # Set to true to enable audit logging which will display all JFR metrics and events in each harvest batch.
    # Audit logging is extremely verbose and should only be used for troubleshooting purposes.
    # Default is false.
    audit_logging: false

    # The time interval, in seconds, of how often JFR data is sent to New Relic.
    # The default is 10 seconds.
    harvest_interval: 10

    # The size of the queue used to store JFR events. Increasing this can reduce gaps in JFR reported data
    # but can also cause resource issues in the agent or cause data to be dropped if backend pipeline
    # limits are exceeded.
    # See: https://docs.newrelic.com/docs/data-apis/ingest-apis/event-api/introduction-event-api/#limits
    #      https://docs.newrelic.com/docs/data-apis/ingest-apis/metric-api/metric-api-limits-restricted-attributes/
    # Default is 250000
    queue_size: 250000

    # If true, the JFR host name will be set to the value in the process_host.display_name config.
    # Note that if the process_host.display_name value is empty/null, the default hostname
    # resolution logic will be used. Default is false.
    use_display_name: false

    labels:
      # If true, JFR data will be decorated with APM labels. This will add labels as attributes prefixed with "tags."
      # Default is false.
      enabled: false

  # Infinite Tracing configuration.
  infinite_tracing:
    # Disables TLS to the trace observer.
    # Default: false
    plaintext: false

    # Enables gRPC compression.
    # Default: true
    compression: true

    # Enables gRPC batching.
    # Default: true
    batching: true

    trace_observer:
      # Trace observer host (required to enable).
      host: ''

      # Trace observer port.
      # Default: 443
      port: 443

    span_events:
      # Span event queue size.
      # Default: 100000
      queue_size: 100000

  # User-configurable custom labels for this agent.  Labels are name-value pairs.
  # There is a maximum of 64 labels per agent.  Names and values are limited to 255 characters.
  # Names and values may not contain colons (:) or semicolons (;).
  labels:

  # An example label
  #label_name: label_value

  # Telemetry signals (Logs, Metrics, and Traces) emitted by OpenTelemetry APIs can
  # be incorporated into the Java agent and controlled by the following config options.
  opentelemetry:

    # Set to true to allow individual OpenTelemetry signals to be enabled, false to disable all OpenTelemetry signals.
    # Default is false.
    enabled: false

    # Legacy setting for SDK autoconfigure. Use opentelemetry.enabled instead.
    # Default is false.
    sdk:
      autoconfigure:
        enabled: false

    # OpenTelemetry Logs signals.
    logs:

      # Set to true to enable OpenTelemetry Logs signals.
      # Default is true.
      enabled: true

    # OpenTelemetry Metrics signals.
    # Dimensional metrics are exported to New Relic over OTLP. With OpenTelemetry 1.59.0 or later,
    # the agent's top-level proxy_host/proxy_port settings will be used to configure the OTLP metric
    # exporter. Note that proxy authentication (proxy_user/proxy_password) and proxy_scheme are NOT
    # applied to the OTLP metric exporter, as the OpenTelemetry SDK does not support proxy authentication.
    metrics:

      # Set to true to enable OpenTelemetry Metrics signals.
      # Default is true.
      enabled: true

      # A comma-delimited string of OpenTelemetry Meters (e.g. "MeterName1,MeterName2") whose signals should be included.
      # By default, all Meters are included. This will override any default Meter excludes in the agent, effectively re-enabling them.
      include: []

      # A comma-delimited string of OpenTelemetry Meters (e.g. "MeterName3,MeterName4") whose signals should be excluded.
      # This takes precedence over all other includes/excludes sources, effectively disabling the listed Meters.
      exclude: []

      # Export interval in milliseconds for OpenTelemetry metrics.
      # Default is 60000 (60 seconds).
      export_interval: 60000

      # Export timeout in milliseconds for OpenTelemetry metrics.
      # Default is 10000 (10 seconds).
      export_timeout: 10000

    # OpenTelemetry Traces signals.
    traces:

      # Set to true to enable OpenTelemetry Traces signals.
      # Default is true.
      enabled: true

      # A comma-delimited string of OpenTelemetry Tracers (e.g. "TracerName1,TracerName2") whose signals should be included.
      # By default, all Tracers are included. This will override any default Tracer excludes in the agent, effectively re-enabling them.
      include: []

      # A comma-delimited string of OpenTelemetry Tracers (e.g. "TracerName3,TracerName4") whose signals should be excluded.
      # This takes precedence over all other includes/excludes sources, effectively disabling the listed Tracers.
      exclude: []

  # New Relic Security vulnerability detection.
  security:
    # Determines whether the security data is sent to New Relic or not. When this is disabled and agent.enabled is
    # true, the security module will run but data will not be sent. Default is false.
    enabled: false

    # New Relic Security provides two modes: IAST and RASP
    # Default is IAST. Due to the invasive nature of IAST scanning, DO NOT enable this mode in either a
    # production environment or an environment where production data is processed.
    mode: IAST

    # New Relic Security’s SaaS connection URL
    validator_service_url: wss://csec.nr-data.net

    # To completely disable all security functionality, set this flag to false. This property is
    # read only once at application start. Default is false.
    agent:
      enabled: false

      # This configuration allows users to specify a unique test identifier when running IAST Scan with CI/CD
      # iast_test_identifier: 'run-id'

      # Security controllers
    scan_controllers:
      # The scan_request_rate_limit configuration allows to specify maximum number of replay request played per minute.
      # The maximum is 3600 and the minimum is 12 replay request per minute.
      iast_scan_request_rate_limit: 3600 # Number of IAST replay request played per minute, Default is 3600
      # This configuration allows users to the number of application instances for a specific entity where IAST analysis is performed.
      scan_instance_count: 0 # Values are 1 or 0, 0 signifies run on all application instances

    # The scan_schedule configuration allows to specify when IAST scans should be executed
    scan_schedule:
      # The delay field specifies the delay in minutes before the IAST scan starts. This allows to schedule the scan to start at a later time.
      delay: 0        #In minutes, default is 0 min
      # The duration field specifies the duration of the IAST scan in minutes. This determines how long the scan will run.
      duration: 0      #In minutes, default is forever

      # The schedule field specifies a cron expression that defines when the IAST scan should start.
      #schedule: ""   #By default, schedule is inactive

      # Allow continuously sample collection of IAST events
      always_sample_traces: false # Default is false

    # The exclude_from_iast_scan configuration allows to specify APIs, parameters, and categories that should not be scanned by Security Agents.
    exclude_from_iast_scan:
      # The api field specifies list of APIs using regular expression (regex) patterns that follow the syntax of Perl 5. The regex pattern should provide a complete match for the URL without the endpoint.
      # Example:
      #   api:
      #    - .*account.*
      #    - .*/\api\/v1\/.*?\/login
      api: [ ]

      # The parameters configuration allows users to specify headers, query parameters, and body keys that should be excluded from IAST scans.
      # Example:
      #   http_request_parameters:
      #    header:
      #      - X-Forwarded-For
      #    query:
      #      - username
      #      - password
      #    body:
      #      - account.email
      #      - account.contact
      http_request_parameters:
        # A list of HTTP header keys. If a request includes any headers with these keys, the corresponding IAST scan will be skipped.
        header: [ ]
        # A list of query parameter keys. The presence of these parameters in the request's query string will lead to skipping the IAST scan.
        query: [ ]
        # A list of keys within the request body. If these keys are found in the body content, the IAST scan will be omitted.
        body: [ ]

      # The iast_detection_category configuration allows to specify which categories of vulnerabilities should not be detected by Security Agents.
      # If any of these categories are set to true, Security Agents will not generate events or flag vulnerabilities for that category.
      iast_detection_category:
        insecure_settings: false
        invalid_file_access: false
        sql_injection: false
        nosql_injection: false
        ldap_injection: false
        javascript_injection: false
        command_injection: false
        xpath_injection: false
        ssrf: false
        rxss: false
        unsafe_deserialization: false
        unsafe_reflection: false

  # Slow transaction detection will report an event to New Relic ("SlowTransaction") whenever a Transaction's
  # time exceeds the threshold value (in ms). A transaction will only be reported once and by default, only
  # transactions that are in-process during a harvest cycle will be checked. Only the slowest single transaction
  # will be reported even if multiple transactions exceed the threshold.
  slow_transactions:
    enabled: true
    threshold: 600000

    # If this is set to true, every transaction will be checked for exceeding the defined threshold on
    # transaction completion. Note that this can be computationally expensive since a stack trace is sent
    # with every SlowTransaction event, if a large number of transaction exceed the threshold.
    evaluate_completed_transactions: false
