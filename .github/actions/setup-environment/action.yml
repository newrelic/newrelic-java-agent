name: Setup Environment
description:  Sets up the environment to build/test the agent.
inputs:
  gradle-cache-read-only:
    description: 'Whether the Gradle cache should be read only'
    required: false
    default: 'true'
# This action expects the agent to be checked out at $GITHUB_WORKSPACE.
# It will also set up the instrumentation jar zip if AWS credentials are set.
# This action requires these because composite actions cannot use secrets.

runs:
  using: composite

  steps:
    - name: Set up Javas
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # pin@v5
      with:
        distribution: 'temurin'
        java-version: |
          27-ea
          25
          21
          17
          11
          8

    - name: set gradle.properties
      shell: bash
      run: |
        sed -i -e "s|jdk8=8|jdk8=${JAVA_HOME_8_X64}|
        s|jdk11=11|jdk11=${JAVA_HOME_11_X64}|
        s|jdk17=17|jdk17=${JAVA_HOME_17_X64}|
        s|jdk21=21|jdk21=${JAVA_HOME_21_X64}|
        s|jdk25=25|jdk25=${JAVA_HOME_25_X64}|
        s|jdk27=27|jdk27=${JAVA_HOME_27_X64}|" gradle.properties.gha
        cat gradle.properties.gha >> gradle.properties

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # pin@v6
      with:
        cache-read-only: ${{ inputs.gradle-cache-read-only }}

    - name: Setup Gradle options
      shell: bash
      run: echo "GRADLE_OPTIONS=--console=plain --parallel -Porg.gradle.java.installations.auto-detect=false -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_11_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64,JAVA_HOME_27_X64" >> $GITHUB_ENV

    # Reproducible builds: the build reads SOURCE_DATE_EPOCH for the manifest Built-Date, so Built-Date is the commit
    # time and not the time the job ran. This is the value GitUtil.commitDate() would use anyway; it is set here so the
    # build does not depend on running git. See https://reproducible-builds.org/specs/source-date-epoch/
    - name: Set SOURCE_DATE_EPOCH to the HEAD commit time
      shell: bash
      run: |
        epoch=$(git log -1 --no-show-signature --format=%ct)
        case "$epoch" in
          ''|*[!0-9]*)
            echo "::error::Could not read the HEAD commit time (got '$epoch'). Check that the repository is checked out before this action runs."
            exit 1
            ;;
        esac
        echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"

    - name: Download S3 instrumentation jar zip
      shell: bash
      run: |
        aws s3 cp s3://nr-java-agent-s3-instrumentation/proprietary-jars-20230623.zip proprietary-jars.zip && unzip proprietary-jars.zip
        if [ $? -ne 0 ]; then
          echo "Instrumentation jar zip unavailable." >> $GITHUB_STEP_SUMMARY
        fi
