name: Agent Metadata

permissions:
  contents: read

on:
  # Allows manual triggering with parameters
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (needs to exactly match the GH tag for the release)"
        required: true
        type: string
      agent-type:
        description: "Agent type"
        required: false
        default: "NRJavaAgent"
        type: string
      use-cache:
        description: "Use cache"
        required: false
        default: true
        type: boolean

  # Allows calling from another workflow
  workflow_call:
    inputs:
      version:
        description: "Version tag (needs to exactly match the GH tag for the release)"
        required: true
        type: string
      agent-type:
        description: "Agent type"
        required: false
        default: "NRJavaAgent"
        type: string
      use-cache:
        description: "Use cache"
        required: false
        default: true
        type: boolean
    secrets:
      AGENT_METADATA_ACTION_LICENSE_KEY:
        required: false

jobs:
  send-agent-metadata:
    #uses: newrelic/newrelic-agent-init-container/.github/workflows/agent-metadata.yml@main
    uses: newrelic/newrelic-agent-init-container/.github/workflows/agent-metadata.yml@cb1347b8a87960391039fe13bd181fa1ad5998a6 # add-env-agent-metadata
    with:
      agent-type: ${{ inputs.agent-type }}
      version: ${{ inputs.version }}
      use-cache: ${{ inputs.use-cache }}
      environment-name: maven-staging-publish-ungated
    secrets:
      AGENT_METADATA_ACTION_LICENSE_KEY: ${{ secrets.AGENT_METADATA_ACTION_LICENSE_KEY }} # action owning team license key
