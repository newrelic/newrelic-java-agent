name: Agent Metadata

permissions:
  contents: read

on:
  # Allows manual triggering with parameters
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (needs to exactly match the GH tag for the release)"
        required: true
        type: string
      agent-type:
        description: "Agent type"
        required: false
        default: "NRJavaAgent"
        type: string
      use-cache:
        description: "Use cache"
        required: false
        default: true
        type: boolean

  # Allows calling from another workflow
  workflow_call:
    inputs:
      version:
        description: "Version tag (needs to exactly match the GH tag for the release)"
        required: true
        type: string
      agent-type:
        description: "Agent type"
        required: false
        default: "NRJavaAgent"
        type: string
      use-cache:
        description: "Use cache"
        required: false
        default: true
        type: boolean

jobs:
  send-agent-metadata:
    uses: newrelic/newrelic-agent-init-container/.github/workflows/agent-metadata.yml@eb28b448d98885b0d3293c3646b69f3c50c6859f # main
    with:
      agent-type: ${{ inputs.agent-type }}
      version: ${{ inputs.version }}
      use-cache: ${{ inputs.use-cache }}
      environment-name: maven-staging-publish-ungated
    secrets: inherit
