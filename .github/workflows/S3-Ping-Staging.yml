name: S3 Ping Staging (Connection Verification)

permissions:
  contents: write
  id-token: write

on:
  pull_request:
  workflow_dispatch:


jobs:
  ping-to-s3:
    name: Ping agent from S3 (Staging)
    runs-on: ubuntu-24.04
    environment: copy-to-s3-staging-ungated
    steps:
      #      - uses: GitHubSecurityLab/actions-permissions/monitor@bf82d13b9b10051d224345ab9184f5ede0a94289 # pin@v1 - detects minimum permissions required to run the workflow, uncomment to use
      - name: Checkout Self
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6
        # This always checkouts main. So the script will be run from main.

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # pin@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}   # your existing role ARN
          aws-region: us-east-2

      - name: Download agent from S3
        env:
          S3_BUCKET: nr-downloads-main
        run: |
          mkdir -p "$RUNNER_TEMP/s3-download"
          aws s3 cp "s3://java-agent-release-staging/newrelic-agent/current/newrelic-java.zip" "$RUNNER_TEMP/s3-download/"

      - name: Upload agent as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin@v7
        with:
          name: newrelic-java
          path: ${{ runner.temp }}/s3-download/
          if-no-files-found: error
