# Runs verifyInstrumentation for all modules.

name: Verify Instrumentation

# Permissions granted to all jobs in the workflow.
# Permissions that aren't explicitly defined here will default to a value of none.
permissions: {}

on:
  workflow_dispatch:
    inputs:
      agent-ref:
        required: true
        default: main
        type: string
        description: 'The ref (branch, SHA, tag?) to run the tests on'
      grouping:
        required: false
        default: ''
        type: string
        description: 'The version grouping scheme to use when verifying versions of a library, one of [ALL, LATEST_MINOR, LATEST_MAJOR, LATEST]. If not specified, will fall back 
        to the module-configured scheme or ALL.'
  workflow_call:
    inputs:
      agent-ref:
        required: true
        default: main
        type: string
        description: 'The ref (branch, SHA, tag?) to run the tests on'
      grouping:
        required: false
        default: ''
        type: string
        description: 'The version grouping scheme to use when verifying versions of a library, one of [ALL, LATEST_MINOR, LATEST_MAJOR, LATEST]. If not specified, will fall back
        to the module-configured scheme or ALL.'
  schedule:
    - cron: '0 8 * * TUE-FRI' #This string is exact-matched in the resolve-grouping job. If you update this, update that job too.
    - cron: '0 8 * * MON'

env:
  #If a version grouping scheme was input by the caller, use it.
  #The daily job (Tuesday - Friday) will use the LATEST_MAJOR scheme for all modules.
  #All other runs (weekly job or no grouping input set by caller) will use the default, which falls back to a module's locally configured scheme or ALL.
  VERSION_GROUPING: ${{ inputs.grouping != '' && inputs.grouping || ( github.event.schedule == '0 8 * * TUE-FRI' && 'LATEST_MAJOR' || '')}}

jobs:

  # The env variable can't be read by reusable workflow calls, so output it as a step byproduct here.
  resolve-grouping:
    name: Resolve version grouping
    runs-on: ubuntu-24.04
    outputs:
      grouping: ${{ steps.set-grouping.outputs.grouping }}
    steps:
      - id: set-grouping
        name: Resolve version grouping
        run: |
          echo "grouping=${{ env.VERSION_GROUPING }}" >> "$GITHUB_OUTPUT"

  # build the agent and saves Gradle's cache so all modules can use the cache
  build-agent:
    name: Build agent
    uses: ./.github/workflows/X-Reusable-BuildAgent.yml
    with:
      agent-ref: ${{ inputs.agent-ref || 'main' }}
      gradle-cache-read-only: ${{ github.event_name != 'schedule' }}
    secrets: inherit

  # GHA Matrix strategy only allows 255 entries.
  # So 2 pages should be good until we have around 500 instrumentation modules
  # When we grow to more than that, we'll need to create a third job here and have pages 1/3, 2/3 and 3/3
  # Also, this new job must be listed in the `needs` for notify-failure

  verify-instrumentation-1:
    name: Page 1/2
    needs: [ build-agent, resolve-grouping ]
    uses: ./.github/workflows/X-Reusable-VerifyInstrumentation.yml
    with:
      page: 1/2
      ref: ${{ inputs.agent-ref || 'main' }}
      grouping: ${{ needs.resolve-grouping.outputs.grouping }}
    secrets: inherit

  verify-instrumentation-2:
    name: Page 2/2
    needs: [ build-agent, resolve-grouping ]
    uses: ./.github/workflows/X-Reusable-VerifyInstrumentation.yml
    with:
      page: 2/2
      ref: ${{ inputs.agent-ref || 'main' }}
      grouping: ${{ needs.resolve-grouping.outputs.grouping }}
    secrets: inherit

  notify-failure:
    needs: [ verify-instrumentation-1, verify-instrumentation-2 ]
    if: ${{ failure() }}
    runs-on: ubuntu-24.04
    steps:
#      - uses: GitHubSecurityLab/actions-permissions/monitor@v1 # detects minimum permissions required to run the workflow, uncomment to use
      - name: Send failure message to Slack
        id: slack
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # pin@3.0.3
        with:
          webhook-type: 'incoming-webhook'
          payload: |
            {
              "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
