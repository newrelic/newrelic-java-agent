name: Build agent

# Permissions granted to all jobs in the workflow.
# Permissions that aren't explicitly defined here will default to a value of none.
permissions:
  contents: read
  id-token: write

on:
  workflow_call:
    inputs:
      agent-ref:
        required: true
        default: main
        type: string
        description: 'The ref (branch, SHA, tag?) to run the tests on'
      gradle-cache-read-only:
        required: false
        default: true
        type: boolean
        description: 'Whether the gradle cache should be read only'
jobs:
  # build the agent and saves Gradle's cache so all modules can use the cache
  build-agent:
    runs-on: ubuntu-24.04
    environment: agent-build-s3-access-ungated
    env:
      # we use this in env var for conditionals (secrets can't be used in conditionals)
      AWS_ARN: ${{ secrets.AWS_ROLE_ARN }}
    steps:
#      - uses: GitHubSecurityLab/actions-permissions/monitor@bf82d13b9b10051d224345ab9184f5ede0a94289 # pin@v1 - detects minimum permissions required to run the workflow, uncomment to use
      - name: Checkout Java agent
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6
        with:
          ref: ${{ inputs.agent-ref }}

      - name: Configure AWS Credentials
        if: ${{ env.AWS_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # pin@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}   # your existing role ARN
          aws-region: us-east-2

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          gradle-cache-read-only: ${{ inputs.gradle-cache-read-only }}

      - name: Build agent
        run: ./gradlew $GRADLE_OPTIONS clean jar

      - name: Cache agent
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # pin@v5.0.5 # pin@v5
        with:
          path: /home/runner/work/newrelic-java-agent/newrelic-java-agent/newrelic-agent/build/newrelicJar/newrelic.jar
          key: agent-jar-${{ github.run_id }}
