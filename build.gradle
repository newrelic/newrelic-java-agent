plugins {
    id 'com.github.prokod.gradle-crossbuild' version '0.17.0' apply false
    id "org.jetbrains.kotlin.jvm" version "1.8.21" apply false
    id "com.newrelic.gradle-verify-instrumentation-plugin" version "4.1" apply false
    id "com.newrelic.gradle-compatibility-doc-plugin" version "1.5" apply false
    id "com.github.spotbugs" version "5.0.14" apply false

}

allprojects {
    apply plugin: 'idea'

    // ignores MANIFEST.MF
    normalization {
        runtimeClasspath {
            metaInf {
                ignoreManifest()
            }
        }
    }

    group = 'com.newrelic.agent.java'
    version = agentVersion + (project.findProperty("release") == "true" ? "" : "-SNAPSHOT")
    version = version + (project.findProperty("release-suffix") != null ? project.findProperty("release-suffix") : "")

    idea.module {
        outputDir file('build/classes/main')
        testOutputDir file('build/classes/test')
    }

    if (project.convention.findPlugin(JavaPluginConvention)) {
        // Change the output directory for the main and test source sets back to the old path
        sourceSets.main.output.classesDir = new File(buildDir, "classes/main")
        sourceSets.test.output.classesDir = new File(buildDir, "classes/test")
    }

    tasks.withType(Copy) {
        includeEmptyDirs = false
    }

    // Produce byte-identical archives for identical inputs.
    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
        // Fixed permissions so the build machine's umask can't change the archive contents. Without these, files the
        // build creates take their mode from the umask (e.g. 0600 under umask 077), which is recorded in each zip
        // entry and gives a different jar hash. Every file in the agent jar is 0644 and every directory 0755.
        // See https://reproducible-builds.org/docs/jvm/
        filePermissions { unix("644") }
        dirPermissions { unix("755") }
    }

    // The JDK 11 javadoc tool writes member/package/type-search-index.zip with the time of the run. Rewrite them with
    // the fixed archive time so the javadoc jar (and the dist zip that bundles it) is byte-identical between builds.
    tasks.withType(Javadoc).configureEach { javadocTask ->
        doLast {
            fileTree(javadocTask.destinationDir).matching { include '**/*-search-index.zip' }.each { File indexZip ->
                def entries = []
                new java.util.zip.ZipFile(indexZip).withCloseable { zip ->
                    zip.entries().each { entry -> entries << [name: entry.name, bytes: zip.getInputStream(entry).bytes] }
                }
                indexZip.withOutputStream { out ->
                    new java.util.zip.ZipOutputStream(out).withCloseable { zip ->
                        entries.each { entry ->
                            def zipEntry = new java.util.zip.ZipEntry(entry.name)
                            zipEntry.time = com.nr.builder.JarUtil.CONSTANT_ENTRY_TIME
                            zip.putNextEntry(zipEntry)
                            zip.write(entry.bytes)
                            zip.closeEntry()
                        }
                    }
                }
            }
        }
    }
}

// This fixes an issue with intellij where the test output build path is incorrect for the top-level java_agent module
idea.module {
    testOutputDir = file('test')
    excludeDirs += file("automation")
}

subprojects {
    repositories {
        mavenLocal()
        mavenCentral()
    }

    def isJavaProject = ![
            'instrumentation',  // is a parent project
            'instrumentation-build', // is a build utility
            'newrelic-java', // this is a project used exclusively for bundling the zip file.
            'infinite-tracing', // has its own plans
    ].contains(project.name)
    if (isJavaProject) {
        project.ext.javaProject = true

        apply from: "$rootProject.projectDir/gradle/script/java.gradle"
    } else {
        // This fixes an issue with intellij where the test output build path is incorrect for non-java projects
        idea.module {
            testOutputDir = file('test')
        }
    }
}

ext {
    // when upgrading ASM, check the javadoc for the following classes:
    // SynchronizedAnnotationNode, SynchronizedClassNode, SynchronizedFieldNode, SynchronizedInnerClassNode, SynchronizedMethodNode,
    // SynchronizedModuleExportNode, SynchronizedModuleNode, SynchronizedModuleOpenNode, SynchronizedModuleProvideNode, SynchronizedModuleRequireNode,
    // SynchronizedTypeAnnotationNode
    asmVersion="9.10.1"
}

apply from: "$rootProject.projectDir/gradle/script/agent-config-schema.gradle"
