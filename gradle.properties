# The agent version.
agentVersion=9.6.0
securityAgentVersion=1.8.0

newrelicDebug=false
# -Duser.language/-Duser.country: scaladoc runs in a Gradle worker JVM, which inherits these from the daemon. They keep the
# Scala javadoc jars from depending on the builder's locale. Keep them in gradle.properties.gha and in the GRADLE_OPTS of
# .github/workflows/Java-Instrumentation-Tests.yml too, which override this value.
org.gradle.jvmargs=-Xmx2048m -Duser.language=en -Duser.country=US
org.gradle.caching=true
file.encoding=utf-8
