jar {
    manifest { attributes 'Implementation-Title': 'com.newrelic.instrumentation.aws-java-sdk-lambda-2.1' }
}



dependencies {
    implementation(project(":agent-bridge"))
    implementation(project(":agent-bridge-datastore"))

    implementation("software.amazon.awssdk:lambda:2.10.14")
}

verifyInstrumentation {
    /*
        This is the original verifier range prior to this update.
        Previously it was simply "passes"; this changes it to
        the standard "passOnly" method.
     */
    versionGrouping 'LATEST_MINOR'
    passesOnly 'software.amazon.awssdk:lambda:[2.1.0,)'
    excludeRegex ".*preview.*"
}

site {
    title 'AWS Lambda'
    type 'Framework'
}
