dependencies {
    implementation(project(":agent-bridge"))
    implementation("software.amazon.awssdk:sns:2.10.19")
}



jar {
    manifest {
        attributes 'Implementation-Title': 'com.newrelic.instrumentation.aws-java-sdk-sns-2.0'
    }
}

verifyInstrumentation {
/*
        This is the original verifier range prior to this update.
        Previously it was simply "passes"; this changes it to
        the standard "passOnly" method.
     */
    versionGrouping 'LATEST_MINOR'
    passesOnly 'software.amazon.awssdk:sns:[2.1.0,)'
    excludeRegex ".*preview.*"
}

site {
    title 'AWS SNS'
    type 'Framework, Messaging'
}
