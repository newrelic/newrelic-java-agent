dependencies {
    implementation(project(":agent-bridge"))
    implementation("software.amazon.awssdk:sqs:2.1.0")
    testImplementation("org.apache.httpcomponents:httpclient:4.5.10")
    testImplementation("org.elasticmq:elasticmq-rest-sqs_2.13:0.15.3")
}



jar {
    manifest { attributes 'Implementation-Title': 'com.newrelic.instrumentation.aws-java-sdk-sqs-2.1.0',
            'Implementation-Title-Alias': 'aws-java-sdk-sqs'  }
}

verifyInstrumentation {
    /*
        This is the original verifier range prior to this update.
        Previously it was simply "passes"; this changes it to
        the standard "passOnly" method.
     */
    versionGrouping 'LATEST_MINOR'
    passesOnly 'software.amazon.awssdk:sqs:[2.1.0,)'
    excludeRegex ".*preview.*"
}

site {
    title 'AWS SQS'
    type 'Framework, Messaging'
}
