dependencies {
    implementation(project(":agent-bridge"))
    implementation("org.apache.cxf:cxf-rt-frontend-simple:3.5.3")
}

jar {
    manifest { attributes 'Implementation-Title': 'com.newrelic.instrumentation.cxf-client-2.1' }
}

verifyInstrumentation {
    passesOnly 'org.apache.cxf:cxf-rt-frontend-simple:[2.1.3,)'

    // These are excluded in v2.0.0 - 2.0.13 since some versions in
    // this range applied and some did not.
    exclude 'org.apache.cxf:cxf-rt-frontend-simple:[2.0.0,2.0.13]'
}

site {
    title 'CXF'
    type 'Framework'
}
