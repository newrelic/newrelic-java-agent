dependencies {
    implementation(project(":agent-bridge"))
    implementation("org.eclipse.jetty:jetty-client:12.0.14")
}

jar {
    manifest {
        attributes 'Implementation-Title': 'com.newrelic.instrumentation.jetty-httpclient-12.0'
    }
}

verifyInstrumentation {
    passesOnly 'org.eclipse.jetty:jetty-client:[12.0.0,)'
}

site {
    title 'Jetty HttpClient'
    type 'Http'
}

// Jetty 12 requires Java 17+
java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(17))
    }
}

compileJava {
    options.fork = true
    options.bootstrapClasspath = null
}
