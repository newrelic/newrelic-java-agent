plugins {
    id("java")
}

dependencies {
    implementation("io.opentelemetry:opentelemetry-exporter-otlp:1.59.0")

    implementation(project(":newrelic-api"))
    implementation(project(":newrelic-weaver-api"))

    // okhttp is a runtime-only transitive of opentelemetry-exporter-sender-okhttp, and is always
    // present wherever RetryInterceptor is loaded, so compileOnly is sufficient here.
    compileOnly("com.squareup.okhttp3:okhttp:5.3.2")

    testImplementation("junit:junit:4.12")
    testImplementation("io.opentelemetry:opentelemetry-sdk-common:1.59.0")
    testImplementation("org.mockito:mockito-inline:4.11.0")
    testImplementation("com.squareup.okhttp3:okhttp:5.3.2")
}

jar {
    manifest {
        attributes "Implementation-Title": "com.newrelic.instrumentation.opentelemetry-exporter-otlp-1.59.0", "Implementation-Title-Alias": "opentelemetry_instrumentation"
    }
}

verifyInstrumentation {
    passesOnly("io.opentelemetry:opentelemetry-exporter-otlp:[1.59.0,)")
}

site {
    title "OpenTelemetry"
    type "Framework"
}
