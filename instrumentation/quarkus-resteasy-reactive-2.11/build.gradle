dependencies {
    implementation(project(":agent-bridge"))
    implementation('io.quarkus:quarkus-resteasy-reactive:2.11.0.Final')
}

jar {
    manifest { attributes 'Implementation-Title': 'com.newrelic.instrumentation.quarkus-resteasy-reactive-2.11',
            'Implementation-Title-Alias': 'quarkus'}
}

verifyInstrumentation {
    versionGrouping 'LATEST_MINOR'
    passesOnly 'io.quarkus:quarkus-resteasy-reactive:[2.11.0.Final,3.9.0)'
    passesOnly 'io.quarkus:quarkus-rest:[3.9.0,)'
    excludeRegex '.*CR.*'
    excludeRegex '.*Alpha[0-9]'
    excludeRegex '.*Beta[0-9]'

    // quarkus-resteasy-reactive: exclude versions before the supported range
    exclude 'io.quarkus:quarkus-resteasy-reactive:[1.11.0.Final,2.11.0.Final)'
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(17))
    }
}

test {
    // These instrumentation tests only run on Java 17+ regardless of the -PtestN gradle property that is set.
    onlyIf {
        !project.hasProperty('test8') && !project.hasProperty('test11')
    }
}

site {
    title 'Quarkus RestEasy Reactive'
    type 'Framework'
}
