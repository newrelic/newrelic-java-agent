dependencies {
    implementation(project(":agent-bridge"))
    implementation("org.springframework.boot:spring-boot-webmvc:4.0.0")
    implementation('jakarta.servlet:jakarta.servlet-api:5.0.0')
}

jar {
    manifest { attributes 'Implementation-Title': 'com.newrelic.instrumentation.spring-boot-actuator-4.0.0' }
}

verifyInstrumentation {
    passesOnly('org.springframework.boot:spring-boot-webmvc:[4.0.0,)') {
        implementation('jakarta.servlet:jakarta.servlet-api:5.0.0')
    }
    excludeRegex ".*(RC|M)[0-9].*"
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(17))
    }
}

test {
    // These instrumentation tests only run on Java 17+ regardless of the -PtestN gradle property that is set.
    onlyIf {
        !project.hasProperty('test8') && !project.hasProperty('test11')
    }
}

site {
    title 'Spring Boot Actuator'
    type 'Framework'
}